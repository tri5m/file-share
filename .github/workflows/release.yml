name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-15
            rust_target: aarch64-apple-darwin
            build_args: --target aarch64-apple-darwin --bundles app
            artifact_name: fileshare-macos-arm64
            artifact_path: release-assets/*.dmg
            dmg_suffix: aarch64
            app_path: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/FileShare.app
          - label: macOS Intel
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            build_args: --target x86_64-apple-darwin --bundles app
            artifact_name: fileshare-macos-intel
            artifact_path: release-assets/*.dmg
            dmg_suffix: x64
            app_path: src-tauri/target/x86_64-apple-darwin/release/bundle/macos/FileShare.app
          - label: Windows x86
            os: windows-latest
            rust_target: i686-pc-windows-msvc
            build_args: --target i686-pc-windows-msvc
            artifact_name: fileshare-windows-x86
            artifact_path: |
              src-tauri/target/i686-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/i686-pc-windows-msvc/release/bundle/msi/*.msi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust_target }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- ${{ matrix.build_args }}

      - name: Create DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-assets
          version="${GITHUB_REF_NAME#v}"
          hdiutil create \
            -volname "FileShare" \
            -srcfolder "${{ matrix.app_path }}" \
            -ov \
            -format UDZO \
            "release-assets/FileShare_${version}_${{ matrix.dmg_suffix }}.dmg"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_path }}
