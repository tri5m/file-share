name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-15
            rust_target: aarch64-apple-darwin
            build_args: --target aarch64-apple-darwin --bundles app
            artifact_name: fileshare-macos-arm64
            artifact_path: release-assets/*
            dmg_suffix: aarch64
            updater_platform: darwin-aarch64
            latest_name: latest-darwin-aarch64.json
          - label: macOS Intel
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            build_args: --target x86_64-apple-darwin --bundles app
            artifact_name: fileshare-macos-intel
            artifact_path: release-assets/*
            dmg_suffix: x64
            updater_platform: darwin-x86_64
            latest_name: latest-darwin-x86_64.json
          - label: Windows x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            build_args: --target x86_64-pc-windows-msvc
            artifact_name: fileshare-windows-x64
            artifact_path: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
              release-assets/*.json
            release_artifact_path: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              release-assets/*.json
            updater_platform: windows-x86_64
            latest_name: latest-windows-x86_64.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust_target }}

      - name: Install dependencies
        run: npm ci

      - name: Prepare updater signing key
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY secret is required" >&2
            exit 1
          fi
          node - <<'NODE'
          const key = process.env.TAURI_SIGNING_PRIVATE_KEY.trim();
          const decoded = Buffer.from(key, 'base64').toString('utf8');
          const firstLine = decoded.split(/\r?\n/, 1)[0] || '';

          if (!firstLine.startsWith('untrusted comment:')) {
            console.error('TAURI_SIGNING_PRIVATE_KEY must be the full content of .updater/file-share.key.');
            process.exit(1);
          }

          if (firstLine.includes('public key')) {
            console.error('TAURI_SIGNING_PRIVATE_KEY is a public key. Use .updater/file-share.key, not .updater/file-share.key.pub.');
            process.exit(1);
          }

          if (!firstLine.includes('secret key')) {
            console.error('TAURI_SIGNING_PRIVATE_KEY is not an updater secret key.');
            process.exit(1);
          }
          NODE
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/tauri-signing.key"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ runner.temp }}/tauri-signing.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          build_args="${{ matrix.build_args }}"
          if [ "${{ runner.os }}" = "Windows" ] && [[ "$GITHUB_REF_NAME" == *rc* ]]; then
            build_args="$build_args --bundles nsis"
          fi
          npm run build -- $build_args

      - name: Create DMG
        if: runner.os == 'macOS'
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version/.rc/-rc.}"
          bundle_dir="src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos"
          app_path="$(find "$bundle_dir" -maxdepth 1 -name '*.app' | head -n 1)"
          if [ -z "$app_path" ]; then
            echo "No macOS app bundle found in $bundle_dir" >&2
            ls -la "$bundle_dir" >&2 || true
            exit 1
          fi
          scripts/create-macos-dmg.sh \
            "$app_path" \
            "release-assets/FileShare_${version}_${{ matrix.dmg_suffix }}.dmg"

      - name: Prepare macOS updater assets
        if: runner.os == 'macOS'
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version/.rc/-rc.}"
          bundle_dir="src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos"
          updater_bundle="$(find "$bundle_dir" -maxdepth 1 -name '*.app.tar.gz' | head -n 1)"
          if [ -z "$updater_bundle" ]; then
            echo "No macOS updater bundle found in $bundle_dir" >&2
            ls -la "$bundle_dir" >&2 || true
            exit 1
          fi
          updater_asset="release-assets/FileShare_${version}_${{ matrix.dmg_suffix }}.app.tar.gz"
          cp "$updater_bundle" "$updater_asset"
          cp "$updater_bundle.sig" "$updater_asset.sig"
          scripts/create-updater-json.sh \
            "${{ matrix.updater_platform }}" \
            "$version" \
            "$updater_asset" \
            "$updater_asset.sig" \
            "release-assets/${{ matrix.latest_name }}" \
            "提升用户体验"

      - name: Prepare Windows updater metadata
        if: runner.os == 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version/.rc/-rc.}"
          updater_asset="$(ls src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe | head -n 1)"
          scripts/create-updater-json.sh \
            "${{ matrix.updater_platform }}" \
            "$version" \
            "$updater_asset" \
            "$updater_asset.sig" \
            "release-assets/${{ matrix.latest_name }}" \
            "提升用户体验"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.release_artifact_path || matrix.artifact_path }}
          body: |
            提升用户体验
          prerelease: ${{ contains(github.ref_name, 'rc') }}
