name: Check

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check frontend syntax
        run: |
          node --check public/app-core.js
          node --check public/app-utils.js
          node --check public/app.js
          node --check public/i18n.js
      - name: Test desktop and HTTP service
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
